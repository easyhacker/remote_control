[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-control"
version = "0.1.0"
description = "Transport-neutral motion protocol: send timed joint goals to robots/simulators, get reports, pause/resume/cancel/stop."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=10"]

[tool.setuptools.packages.find]
include = ["remote_control*"]

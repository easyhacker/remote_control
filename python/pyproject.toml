[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-control"
version = "0.3.0"
description = "Transport-neutral motion protocol: send timed joint goals to robots/simulators, get reports, pause/resume/cancel/stop."
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=10"]
mqtt = ["paho-mqtt>=2.0"]
all = ["websockets>=10", "paho-mqtt>=2.0"]

[tool.setuptools.packages.find]
include = ["remote_control*"]
